name: release

on:
  workflow_dispatch:
    inputs:
      github:
        description: 'Github'
        required: true
        default: true
        type: boolean
      modrinth:
        description: 'Modrinth'
        required: true
        default: true
        type: boolean
      curseforge:
        description: 'CurseForge'
        required: true
        default: true
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit

      - name: build
        run: ./gradlew build

      - name: github release
        if: inputs.github == true
        run: |
          tag=$(sed -n 's/^mod_version=//p' gradle.properties)
          mod_release_version=$(sed -n 's/^mod_release_version=//p' gradle.properties)
          gh release upload "$tag" "build/libs/NoTextureRotations-${tag}+${mod_release_version}.jar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: modrinth release
        if: inputs.modrinth == true
        run: ./gradlew publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: curseforge release
        if: inputs.curseforge == true
        run: ./gradlew publishCurseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
